{% extends "base.html" %}

{% block title %}Submenú Juntas de Accionistas - Metrovalores{% endblock %}

{% block extra_css %}
<style>
    /* Estilos específicos para asegurar la adaptabilidad móvil de los botones */
    .boton-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
    }
    .boton-imagen {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
    }
</style>
{% endblock %}

{% block body_class %}azul-marino{% endblock %}

{% block content %}
    <main>
        <div class="container">
            <div class="boton-container">
                <a href="/junta_de_accionistas_2024">
                    <img src="/static/img/botones/JDA_2024.png" alt="Resultados 2024" class="boton-imagen">
                </a>
                <a href="/junta_de_accionistas_2025">
                    <img src="/static/img/botones/JDA_2025.png" alt="Resultados 2025" class="boton-imagen">
                </a>
            </div>
        </div>
    </main>
{% endblock %}
