{% extends "base.html" %}

{% block title %}Informe Semanal - Metrovalores{% endblock %}

{% block extra_css %}
<style>
    .contenedor-imagen {
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
    }
    .contenedor-imagen img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .titulo-centro {
        text-align: center;
        margin-bottom: 20px;
    }
    .titulo-profesional {
        font-size: 2rem;
        margin-bottom: 5px;
    }

    /* Optimización móvil limpia sin alterar escritorio */
    @media (max-width: 768px) {
        .contenedor-imagen {
            padding: 10px 0;
        }
        .titulo-profesional {
            font-size: 1.5rem;
        }
    }
</style>
{% endblock %}

{% block body_class %}azul-marino{% endblock %}

{% block content %}
    <main>
        <div class="container">
            <div class="titulo-centro">
                <h1 class="titulo-profesional">Informe Semanal de Renta Variable</h1>
                <p>{{ fecha_actual }}</p>
            </div>

            <div class="contenedor-imagen">
                <img src="/static/img/renta_variable.png" alt="Informe Renta Variable">
            </div>
        </div>
    </main>
{% endblock %}
