{% extends "base.html" %}

{% block title %}Submenú Renta Variable - Metrovalores{% endblock %}

{% block extra_css %}
<style>
    /* Estilos específicos para asegurar la adaptabilidad móvil de los botones */
    .boton-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
    }
    .boton-imagen {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
    }
</style>
{% endblock %}

{% block body_class %}azul-marino{% endblock %}

{% block content %}
    <main>
        <div class="container">
            <div class="boton-container">
                <a href="/renta-variable">
                    <img src="/static/img/botones/renta_variable_1.png" alt="Renta Variable" class="boton-imagen">
                </a>
                <a href="/informacion-individual-por-empresa">
                    <img src="/static/img/botones/renta_variable_2.png" alt="Información por empresa" class="boton-imagen">
                </a>
                <a href="/calculadora-de-rendimientos">
                    <img src="/static/img/botones/renta_variable_3.png" alt="Calculadora de rendimientos" class="boton-imagen">
                </a>
            </div>
        </div>
    </main>
{% endblock %}
